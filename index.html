<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>scenar.io — editor</title>
<style>

:root {
  --bg: #1d1e1c;
  --panel: #232421;
  --panel-2: #2b2b27;
  --input: #181917;
  --line: #45443d;
  --line-soft: #35352f;
  --text: #ede2d0;
  --text-dim: #b8ad9b;
  --text-faint: #7e786d;
  --copper: #c8a46b;
  --copper-strong: #d8b679;
  --choice: #b38ca5;
  --dice: #c3ad86;
  --surface: #9b8d78;
  --condition: #8fae8a;
  --danger: #c87d69;
  --accent-scene: var(--copper-strong);
  --accent-name: var(--copper);
  --accent-action: #aaa294;
  --accent-choice: var(--choice);
  --accent-label: var(--surface);
  --border: var(--line);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: var(--text);
  background: var(--bg);
  font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
}
::selection { background: rgba(200,164,107,.32); color: var(--text); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

button, input, textarea { font: inherit; }
button {
  min-height: 32px;
  padding: 6px 10px;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { color: var(--text); background: var(--panel-2); border-color: var(--text-faint); }
button:active { background: var(--input); }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 1px solid var(--copper);
  outline-offset: 2px;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 7px 12px;
  flex: 0 0 auto;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.win-dots { display: none; }
.topbar .path {
  display: flex;
  align-items: center;
  color: var(--text-faint);
  font-size: 14px;
  letter-spacing: .025em;
  white-space: nowrap;
}
.topbar .path .prompt { color: var(--copper); }
.topbar .path b, .topbar .path .ext { color: var(--text); font-weight: 800; }
.topbar .path::after { content: "_"; color: var(--copper); margin-left: 2px; }
.status { display: flex; align-items: center; gap: 7px; margin-left: auto; color: var(--text-faint); font-size: 11px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
.status.saving .status-dot { background: var(--copper); }
.status.saved .status-dot { background: var(--copper); }
.status.error .status-dot { background: var(--danger); }
.topbar > button:not(#sidebar-toggle) { min-height: 30px; padding: 5px 9px; text-transform: lowercase; }
button.primary { color: var(--copper-strong); border-color: #725c3c; }
button.primary:hover { color: var(--text); border-color: var(--copper); background: #2b251d; }
#sidebar-toggle { display: none; }

.main { display: flex; flex: 1 1 auto; min-height: 0; background: var(--bg); }
.sidebar {
  width: 276px;
  flex: 0 0 276px;
  padding: 16px 14px;
  overflow-y: auto;
  background: var(--bg);
  border-right: 1px solid var(--line);
}
.sidebar h2, .menu-label {
  margin: 0 0 9px;
  color: var(--text-faint);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
}
.sidebar h2::before, .menu-label::before { content: "// "; color: var(--copper); }
.char-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 6px 4px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line-soft);
}
.char-row:hover { background: var(--panel); }
.char-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; box-shadow: none !important; }
.char-row .shortcut { min-width: 18px; color: var(--text-faint); font-size: 10px; }
.char-row .name { flex: 1; overflow: hidden; color: var(--copper); font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; text-shadow: none !important; }
.char-row .remove { flex-shrink: 0; min-width: 26px; min-height: 24px; padding: 1px 6px; border: 0; color: var(--text-faint); }
.char-row .remove:hover { color: var(--danger); background: transparent; }
.char-empty { padding: 7px 0; color: var(--text-faint); font-size: 12px; }
.add-char { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.add-char .row { display: flex; align-items: center; gap: 6px; }
.add-char input[type="text"] {
  min-width: 0;
  min-height: 32px;
  padding: 6px 8px;
  color: var(--text);
  background: var(--input);
  border: 1px solid var(--line);
  border-radius: 3px;
}
.add-char input[name="shortcut"] { width: 46px; flex: 0 0 46px; text-align: center; }
.add-char input[name="charname"] { width: 0; flex: 1 1 auto; }
#new-color, .color-edit {
  appearance: auto;
  -webkit-appearance: auto;
  display: block;
  flex-shrink: 0;
  width: 30px !important;
  min-width: 30px !important;
  height: 30px !important;
  padding: 2px !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  cursor: pointer;
  background: var(--bg) !important;
  border: 1px solid var(--line) !important;
  border-radius: 3px !important;
  box-shadow: none !important;
}
.add-char > button { width: 100%; color: var(--copper); border-color: #6d593c; }
.insert-menu { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.menu-label { margin-top: 11px; margin-bottom: 6px; }
.insert-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 0; }
.insert-buttons.interaction-actions { grid-template-columns: 1fr; }
.insert-buttons button { display: flex; align-items: center; justify-content: flex-start; width: 100%; min-width: 0; min-height: 35px; }
.insert-buttons button span { margin-right: 6px; color: var(--copper); }
.hint { display: none; }

.editor-shell { display: flex; flex: 1 1 auto; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg); }
.document-tabs {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  min-height: 42px;
  padding: 0 9px;
  overflow: hidden;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.tabs-scroll { display: flex; align-items: flex-end; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.doc-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 96px;
  max-width: 210px;
  height: 38px;
  padding: 0 9px 0 12px;
  color: var(--text-faint);
  border: 0;
  border-radius: 0;
}
.doc-tab.active { color: var(--text); background: var(--panel-2); border-bottom: 2px solid var(--copper); }
.doc-tab.active::before { content: ">"; color: var(--copper); font-weight: 900; }
.doc-tab .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-tab .tab-close { width: 20px; min-height: 20px; margin-left: auto; padding: 0; border: 0; color: var(--text-faint); }
.tab-add { width: 30px; min-width: 30px; height: 30px; min-height: 30px; margin: 0 0 4px 4px; padding: 0; color: var(--copper); }

.block-editor { width: 100%; height: 100%; margin: 0; padding: 16px 18px 80px; overflow: auto; overflow-x: hidden; }
.block-editor > [data-segment], .editable-wrap, .special-block { width: 100%; max-width: none; }
.editable-wrap { position: relative; isolation: isolate; }
.text-highlight {
  position: absolute;
  inset: 0;
  z-index: 1;
  margin: 0;
  padding: 5px 6px;
  overflow: hidden;
  color: var(--text);
  font: inherit;
  font-size: 14.5px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  pointer-events: none;
  opacity: 1;
}
.text-segment, .special-body {
  position: relative;
  z-index: 2;
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 1.7em;
  margin: 0;
  padding: 5px 6px;
  overflow: hidden;
  color: transparent !important;
  -webkit-text-fill-color: transparent !important;
  caret-color: var(--text) !important;
  background: transparent;
  border: 0;
  outline: 0;
  resize: none;
  font-size: 14.5px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.text-segment { margin-bottom: 6px; }
.text-segment:focus, .special-body:focus { background: rgba(255,255,255,.012); }
.text-highlight .scene { color: var(--copper-strong); font-weight: 800; }
.text-highlight .action { color: var(--accent-action); font-style: italic; }
.text-highlight .speaker { color: var(--copper); font-weight: 900; letter-spacing: .02em; filter: none !important; text-shadow: none !important; }
.text-highlight .dialogue-text { color: var(--text); }
.text-highlight .option-key, .text-highlight .branch-marker { color: var(--choice); font-weight: 900; }
.text-highlight .else-marker { color: var(--condition); font-weight: 900; }
.text-highlight .condition-label { color: var(--condition); font-weight: 800; font-style: italic; }
.text-highlight .option-text { color: var(--text); }
.text-highlight .dice-range { color: var(--dice); font-weight: 850; }
.text-highlight .surface-command, .text-highlight .surface-arrow { color: var(--text-faint); }
.text-highlight .surface-label { color: var(--text); font-weight: 750; }
.text-highlight .surface-target { color: var(--copper); font-weight: 750; }

.special-block {
  --block-accent: var(--copper);
  margin: 15px 0 19px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid var(--block-accent);
  border-radius: 3px;
  box-shadow: none;
}
.special-block.choice { --block-accent: var(--choice); --block-color: var(--choice); }
.special-block.dice { --block-accent: var(--dice); --block-color: var(--dice); }
.special-block.surface { --block-accent: var(--surface); --block-color: var(--surface); }
.special-block.condition { --block-accent: var(--condition); --block-color: var(--condition); }
.block-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 7px 10px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
}
.block-head .collapse { width: 25px; min-height: 25px; padding: 0; color: var(--block-accent); background: transparent; border: 0; }
.block-title { color: var(--text); font-size: 11px; font-weight: 900; letter-spacing: .13em; }
.block-count { padding: 2px 6px; color: var(--text-dim); font-size: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; }
.block-tools { display: flex; gap: 5px; margin-left: auto; }
.block-tools button { min-height: 28px; padding: 4px 8px; background: var(--panel); }
.block-tools .add-row { color: var(--block-accent); border-color: var(--block-accent); }
.block-tools .remove-block { color: var(--text-faint); }
.block-content { padding: 14px 16px 16px; background: var(--bg); }
.special-body { min-height: 72px; }
.special-block.collapsed .block-content { display: none; }
.special-block.collapsed .block-head { border-bottom: 0; }
.surface-preview { margin-top: 13px; padding: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }
.surface-preview-title { margin-bottom: 9px; color: var(--text-faint); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
.surface-preview-title::before { content: "// "; color: var(--copper); }
.surface-items { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 7px; }
.surface-hotspot { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 9px; width: 100%; min-height: 38px; text-align: left; background: var(--bg); }
.hotspot-label { overflow: hidden; color: var(--text); font-weight: 700; text-overflow: ellipsis; }
.hotspot-arrow { color: var(--text-faint); }
.hotspot-target { color: var(--copper); font-size: 11px; }
.footer { flex: 0 0 auto; padding: 5px 14px; color: var(--text-faint); background: var(--bg); border-top: 1px solid var(--line); font-size: 10px; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.5); }
.sidebar-backdrop.open { display: block; }

/* No decorative motion. The static underscore in the brand is intentional. */
*, *::before, *::after { animation: none !important; transition: none !important; }

@media (max-width: 1024px) {
  .sidebar { width: 250px; flex-basis: 250px; }
  .block-editor { padding: 14px 14px 72px; }
}

/* Unified compact typography */
:root {
  --font-ui: 11px;
  --font-editor: 12.5px;
  --font-meta: 9.5px;
  --line-ui: 1.35;
  --line-editor: 1.62;
}
body, button, input, textarea { font-size: var(--font-ui) !important; }
.topbar .path,
.topbar button,
.status,
.sidebar,
.char-row,
.char-row .name,
.char-row .shortcut,
.add-char input,
.add-char button,
.menu-label,
.sidebar h2,
.insert-buttons button,
.doc-tab,
.tab-add,
.block-title,
.block-count,
.block-tools button,
.surface-preview-title,
.surface-hotspot,
.footer,
.char-empty {
  font-size: var(--font-ui) !important;
  line-height: var(--line-ui) !important;
}
.topbar .path { font-weight: 700 !important; }
.sidebar h2, .menu-label, .surface-preview-title, .footer, .status, .block-count {
  font-size: var(--font-meta) !important;
}
.text-highlight,
.text-segment,
.special-body {
  font-size: var(--font-editor) !important;
  line-height: var(--line-editor) !important;
}
.text-highlight .scene,
.text-highlight .speaker,
.text-highlight .dialogue-text,
.text-highlight .option-key,
.text-highlight .option-text,
.text-highlight .branch-marker,
.text-highlight .dice-range,
.text-highlight .surface-command,
.text-highlight .surface-label,
.text-highlight .surface-arrow,
.text-highlight .surface-target {
  font-size: inherit !important;
  line-height: inherit !important;
}
/* Compact dimensions matching the smaller type scale */
.topbar { min-height: 42px; padding: 5px 10px; }
.topbar > button:not(#sidebar-toggle) { min-height: 28px; padding: 4px 8px; }
.sidebar { width: 264px; flex-basis: 264px; padding: 14px 12px; }
.char-row { min-height: 34px; }
.add-char input[type="text"] { min-height: 30px; }
.add-char > button, .insert-buttons button { min-height: 32px; }
.document-tabs { min-height: 38px; }
.doc-tab { height: 34px; }
.tab-add { width: 28px; min-width: 28px; height: 28px; min-height: 28px; }
.block-editor { padding: 13px 15px 72px; }
.block-head { min-height: 39px; padding: 5px 8px; }
.block-head .collapse { width: 23px; min-height: 23px; }
.block-tools button { min-height: 25px; padding: 3px 7px; }
.block-content { padding: 11px 13px 13px; }
.special-body { min-height: 62px; }
.surface-hotspot { min-height: 34px; }
@media (max-width: 1024px) {
  .sidebar { width: 242px; flex-basis: 242px; }
}

/* Final terminal polish: blinking brand + integrated blocks */
@keyframes terminal-caret {
  0%, 46% { opacity: 1; }
  47%, 100% { opacity: 0; }
}
.topbar .path::after {
  content: "_";
  display: inline-block;
  width: .65em;
  margin-left: 2px;
  color: var(--copper);
  animation: terminal-caret 1.05s steps(1, end) infinite !important;
}

/* Blocks follow the same terminal language as the rest of scenar.io. */
.special-block {
  --block-accent: var(--copper);
  margin: 12px 0 16px !important;
  overflow: visible !important;
  background: transparent !important;
  border: 0 !important;
  border-left: 2px solid var(--block-accent) !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}
.special-block.choice { --block-accent: var(--choice); }
.special-block.dice { --block-accent: var(--dice); }
.special-block.surface { --block-accent: var(--surface); }
.special-block.condition { --block-accent: var(--condition); }
.block-head {
  min-height: 32px !important;
  padding: 3px 6px 4px 8px !important;
  gap: 7px !important;
  background: transparent !important;
  border: 0 !important;
  border-bottom: 1px solid var(--line-soft) !important;
}
.block-head .collapse {
  width: 20px !important;
  min-height: 20px !important;
  padding: 0 !important;
  color: var(--block-accent) !important;
  background: transparent !important;
  border: 0 !important;
}
.block-title {
  color: var(--block-accent) !important;
  font-size: var(--font-meta) !important;
  font-weight: 800 !important;
  line-height: var(--line-ui) !important;
  letter-spacing: .12em !important;
}
.block-title::before { content: "// "; color: var(--text-faint); }
.block-count {
  padding: 0 !important;
  color: var(--text-faint) !important;
  font-size: var(--font-meta) !important;
  line-height: var(--line-ui) !important;
  background: transparent !important;
  border: 0 !important;
}
.block-tools { gap: 4px !important; }
.block-tools button {
  min-height: 23px !important;
  padding: 2px 6px !important;
  color: var(--text-faint) !important;
  font-size: var(--font-meta) !important;
  background: transparent !important;
  border-color: var(--line-soft) !important;
}
.block-tools .add-row {
  color: var(--block-accent) !important;
  border-color: color-mix(in srgb, var(--block-accent) 55%, var(--line)) !important;
}
.block-tools button:hover {
  color: var(--text) !important;
  background: var(--panel) !important;
  border-color: var(--block-accent) !important;
}
.block-content {
  padding: 9px 9px 10px 12px !important;
  background: transparent !important;
}
.special-body { min-height: 54px !important; }
.special-block.collapsed .block-head { border-bottom: 0 !important; }

/* PLOCHA preview is a terminal list, not a card inside a card. */
.surface-preview {
  margin: 8px 0 0 !important;
  padding: 8px 0 0 !important;
  background: transparent !important;
  border: 0 !important;
  border-top: 1px dashed var(--line-soft) !important;
}
.surface-preview-title {
  margin-bottom: 6px !important;
  color: var(--text-faint) !important;
  font-size: var(--font-meta) !important;
}
.surface-items { gap: 4px !important; }
.surface-hotspot {
  min-height: 29px !important;
  padding: 4px 7px !important;
  background: transparent !important;
  border-color: var(--line-soft) !important;
  border-radius: 2px !important;
}
.surface-hotspot:hover {
  background: var(--panel) !important;
  border-color: var(--block-accent) !important;
}
.hotspot-label, .hotspot-target { font-size: var(--font-ui) !important; }

@media (prefers-reduced-motion: reduce) {
  .topbar .path::after { animation: none !important; opacity: 1; }
}

/* Mobile nav/sheet chrome hidden entirely on desktop; laid out in the consolidated mobile block below. */
.mobile-nav,.mobile-sheet,.mobile-sheet-backdrop{display:none}

}

/* Supabase cloud panel */
.cloud-modal-backdrop{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62)}
.cloud-modal-backdrop.open{display:block}
.cloud-modal{display:none;position:fixed;z-index:41;top:50%;left:50%;width:min(520px,calc(100vw - 24px));max-height:86dvh;overflow:auto;transform:translate(-50%,-50%);background:var(--bg);border:1px solid var(--line)}

/* ============================================================
   MOBILE (consolidated) — single source of truth, ≤720px.
   Replaces every earlier fragmented @media(max-width:720px)
   block in this file. Editing on mobile uses a plain, fully
   native <textarea> while editing and a syntax-highlight overlay
   while reading. Only one text layer is visible at a time, preventing
   doubled glyphs and IME/composition drift. The textarea is sized with real height (never overflow:hidden, so typed text
   can never be clipped out of view), and the bottom nav/tabs
   get out of the way automatically while the keyboard is open.
   ============================================================ */
@media (max-width: 720px) {
  :root { --mobile-nav-h: 58px; --keyboard-height: 0px; }
  html, body { height: 100%; overscroll-behavior: none; background: var(--bg); }
  body {
    height: 100dvh;
    min-height: 100dvh;
    padding-bottom: 0;
  }

  /* --- top bar --- */
  .topbar { min-height: 44px; padding: 6px 8px; flex-wrap: nowrap; gap: 6px; }
  .topbar .path { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px !important; }
  .topbar .status { order: initial; flex: 0 0 auto; margin-left: auto; font-size: 0 !important; }
  .topbar .status-dot { width: 7px; height: 7px; }
  #copy-btn, #export-btn, #import-btn, #sidebar-toggle { display: none !important; }

  /* --- character panel opens as a slide-over sheet (bottom nav "postavy") --- */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 10;
    width: 86%; max-width: 300px;
    transform: translateX(-100%);
    box-shadow: none;
  }
  .sidebar.open { transform: translateX(0); }
  .scene-navigator { display: none !important; }
  #cloud-btn { padding: 3px; font-size: 0 !important; }
  #cloud-btn::before { font-size: 13px; }

  /* --- layout shell --- */
  .main { min-height: 0; height: calc(100dvh - 44px); padding-bottom: var(--mobile-nav-h); }
  .editor-shell { width: 100%; min-width: 0; }
  .document-tabs { min-height: 38px; height: 38px; padding: 0 6px; }
  .doc-tab { min-width: 82px; max-width: 132px; height: 36px; padding: 0 7px; }
  .doc-tab .tab-close { width: 18px; min-height: 18px; }
  .tab-add { width: 28px; min-width: 28px; height: 28px; min-height: 28px; margin-bottom: 4px; }
  .footer { display: none; }

  /* --- editor scroll area --- */
  .block-editor {
    padding: 8px 6px calc(var(--mobile-nav-h) + 20px);
    scroll-padding-bottom: calc(var(--mobile-nav-h) + 20px);
    overflow-y: auto;
    overscroll-behavior-y: contain;
  }

  /* --- stable hybrid editor: colored overlay when idle, native text while editing.
     overflow-y:auto + max-height is a safety net: JS grows the box to fit
     as you type, but if a resize is ever a frame late, the textarea's own
     native scrolling keeps the caret visible instead of the line being
     invisible until something bigger (like a pasted paragraph) forces a
     reflow. This was the actual cause of "text not visible until I type a
     whole paragraph". --- */
  .editable-wrap { overflow: visible; }
  .editable-wrap .text-highlight {
    display: block !important;
    z-index: 1;
    height: 100%;
    overflow: hidden !important;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace !important;
    font-size: 16px !important;
    line-height: 1.55 !important;
    letter-spacing: normal !important;
    font-kerning: none;
    font-variant-ligatures: none;
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .text-segment, .special-body {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    max-height: none;
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
    caret-color: var(--copper-strong) !important;
    background: transparent !important;
    overflow: hidden !important;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    font-size: 16px !important;     /* prevents iOS auto-zoom-on-focus */
    line-height: 1.55 !important;
    letter-spacing: normal;
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    touch-action: manipulation;
  }
  .text-segment::selection, .special-body::selection {
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
    background: rgba(200,164,107,.32) !important;
  }
  /* On focus use one native text layer. This avoids doubled glyphs and IME drift. */
  .editable-wrap:focus-within .text-highlight,
  .editable-wrap.mobile-composing .text-highlight { visibility: hidden !important; }
  .editable-wrap:focus-within .text-segment,
  .editable-wrap:focus-within .special-body,
  .editable-wrap.mobile-composing .text-segment,
  .editable-wrap.mobile-composing .special-body {
    color: var(--text) !important;
    -webkit-text-fill-color: var(--text) !important;
  }
  .editable-wrap:focus-within .text-segment::selection,
  .editable-wrap:focus-within .special-body::selection {
    color: var(--text) !important;
    -webkit-text-fill-color: var(--text) !important;
  }
  textarea:focus { scroll-margin-top: 12px; scroll-margin-bottom: calc(var(--keyboard-height, 0px) + 20px); }

  /* --- special blocks (VOLBA / HOD KOSTKOU / PLOCHA / JESTLI) --- */
  .special-block { margin: 9px 0 12px; }
  .block-head { min-height: 38px; padding: 5px 7px; flex-wrap: nowrap; align-items: center; }
  .block-title { font-size: 10px; white-space: nowrap; max-width: 29%; overflow: hidden; text-overflow: ellipsis; }
  .block-count { font-size: 9px; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .block-tools { width: auto; margin-left: auto; display: flex; flex: 0 0 auto; gap: 4px; }
  .block-tools button { min-height: 32px; padding: 4px 7px; font-size: 10px; }
  .block-tools .remove-block { display: inline-flex; }
  .block-content { padding: 8px 7px 10px; }
  .surface-items { grid-template-columns: 1fr; }
  .surface-hotspot { grid-template-columns: minmax(0,1fr) auto; min-height: 42px; }
  .hotspot-arrow { display: none; }

  /* --- bottom navigation --- */
  .mobile-nav {
    position: fixed; z-index: 20; left: 0; right: 0;
    bottom: 0;
    display: grid; grid-template-columns: repeat(5,1fr); align-items: stretch;
    min-height: var(--mobile-nav-h);
    padding: 5px 5px calc(5px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 94%, transparent);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .mobile-nav button { min-width: 0; min-height: 46px; padding: 4px 2px; border: 0; border-radius: 3px; font-size: 10px; color: var(--text-faint); }
  .mobile-nav button:active, .mobile-nav button.active { color: var(--copper); background: var(--panel); }
  .mobile-nav .mobile-add { color: var(--copper); font-weight: 800; border: 1px solid #6d593c; }

  /* --- bottom sheet (quick-insert / cards / scenes / more) --- */
  .mobile-sheet-backdrop { position: fixed; z-index: 21; inset: 0; display: block; visibility: hidden; opacity: 0; background: rgba(0,0,0,.56); pointer-events: none; }
  .mobile-sheet-backdrop.open { visibility: visible; opacity: 1; pointer-events: auto; }
  .mobile-sheet {
    position: fixed; z-index: 22; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    max-height: min(72dvh,620px);
    padding-bottom: env(safe-area-inset-bottom);
    visibility: hidden; transform: translateY(100%);
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .mobile-sheet.open { visibility: visible; transform: translateY(0); }
  .mobile-sheet-head { display: flex; align-items: center; min-height: 46px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .mobile-sheet-head strong { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--text-dim); }
  .mobile-sheet-head button { margin-left: auto; width: 34px; min-height: 34px; padding: 0; }
  .mobile-sheet-content { padding: 8px; overflow: auto; overscroll-behavior: contain; }
  .mobile-menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .mobile-menu-grid button { min-height: 48px; text-align: left; color: var(--text); background: var(--panel); }
  .mobile-list { display: grid; gap: 4px; }
  .mobile-list button { display: flex; align-items: center; width: 100%; min-height: 46px; text-align: left; }
  .mobile-list button.current { color: var(--copper); border-color: var(--copper); }
  .mobile-list small { margin-left: auto; color: var(--text-faint); }

  /* --- focus mode (manual toggle from "více" menu) — the one deliberate
     way chrome hides itself; nothing hides automatically anymore, because
     auto-hiding tied to keyboard/resize events is what caused the page to
     jump and flash blank earlier. --- */
  body.mobile-focus .topbar, body.mobile-focus .document-tabs, body.mobile-focus .mobile-nav { display: none !important; }
  body.mobile-focus .main { padding-bottom: 0; }
  body.mobile-focus .block-editor { padding-bottom: 24px; }
  body.mobile-focus .special-block:not(:focus-within), body.mobile-focus .block-editor > [data-segment]:not(:focus-within) { opacity: .28; }

  /* --- cloud modal as a bottom sheet --- */
  .cloud-modal { top: auto; bottom: 0; left: 0; width: 100%; max-height: 88dvh; transform: none; border-left: 0; border-right: 0; border-bottom: 0; }
  .cloud-modal-body { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .cloud-config-actions button, .cloud-auth-actions button, .cloud-sync-actions button { min-height: 42px; flex: 1; }
}
@media (max-width: 390px) {
  .block-editor { padding-left: 4px; padding-right: 4px; }
  .block-tools button { padding-left: 5px; padding-right: 5px; }
  .mobile-nav button { font-size: 9px; }
}

alter table public.documents enable row level security;
create policy "users read own docs" on public.documents for select using (auth.uid() = user_id);
create policy "users insert own docs" on public.documents for insert with check (auth.uid() = user_id);
create policy "users update own docs" on public.documents for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "users delete own docs" on public.documents for delete using (auth.uid() = user_id);

-- Realtime, spusť jednou:
alter publication supabase_realtime add table public.documents;</textarea><button type="button" id="copy-sql">kopírovat SQL</button></details>

      if(isPrompt) requestAnimationFrame(()=>{inputEl.focus();inputEl.select();});
      function cleanup(result){
        backdrop.classList.remove('open'); modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
        okBtn.removeEventListener('click',onOk); cancelBtn.removeEventListener('click',onCancel);
        backdrop.removeEventListener('click',onCancel); inputEl.removeEventListener('keydown',onKey);
        resolve(result);
      }
      function onOk(){ cleanup(isPrompt?inputEl.value:true); }
      function onCancel(){ cleanup(isPrompt?null:false); }
      function onKey(e){ if(e.key==='Enter'){e.preventDefault();onOk();} if(e.key==='Escape')onCancel(); }
      okBtn.addEventListener('click',onOk);
      cancelBtn.addEventListener('click',onCancel);
      backdrop.addEventListener('click',onCancel);
      inputEl.addEventListener('keydown',onKey);
    });
  }
  function setStatus(text,state='saved'){ lastStatus={text,state}; statusText.textContent=text; statusEl.className='status '+state; }
  function flash(text){ statusText.textContent=text; statusEl.className='status error'; setTimeout(()=>setStatus(lastStatus.text,lastStatus.state),1500); }

  function renderLine(line){
    const safe=esc(line);
    if(/^#/.test(line)) return '<span class="scene">'+safe+'</span>';
    if(/^\s*\/\//.test(line)) return '<span class="action">'+safe+'</span>';

    const dialogue=line.match(/^([^:\n]{1,50}):(.*)$/);
    if(dialogue){
      const character=characters.find(c=>c.name.trim().toLocaleUpperCase('cs-CZ')===dialogue[1].trim().toLocaleUpperCase('cs-CZ'));
      if(character){
        const color=esc(character.color||'#c8a46b');
        return '<span class="dialogue-line"><span class="speaker" style="color:'+color+'">'+esc(dialogue[1])+':</span><span class="dialogue-text">'+esc(dialogue[2])+'</span></span>';
      }
    }

    const option=line.match(/^([A-Z])\s+(.+)$/);
    if(option) return '<span class="option-key">'+esc(option[1])+'</span><span class="option-text"> '+esc(option[2])+'</span>';
    const branch=line.match(/^=\s*([A-Z])\s*$/);
    if(branch) return '<span class="branch-marker">= '+esc(branch[1])+'</span>';
    if(/^JINAK\s*$/i.test(line.trim())) return '<span class="else-marker">'+safe+'</span>';
    const conditionLabel=line.trim().match(/^"(.+)"$/);
    if(conditionLabel) return '<span class="condition-label">'+safe+'</span>';
    const range=line.match(/^(\d+)\s*-\s*(\d+)\s*$/);
    if(range) return '<span class="dice-range">'+safe+'</span>';
    const surface=line.match(/^([-*]\s*(?:click|klik)\s+)(.+?)(\s*(?:=>|->|—>|→)\s*)(.+)$/i);
    if(surface) return '<span class="surface-command">'+esc(surface[1])+'</span><span class="surface-label">'+esc(surface[2])+'</span><span class="surface-arrow">'+esc(surface[3])+'</span><span class="surface-target">'+esc(surface[4])+'</span>';
    return safe || ' ';
  }
  function updateHighlight(ta){
    const mirror=ta.parentElement?.querySelector('.text-highlight');
    if(!mirror)return;
    mirror.innerHTML=ta.value.split('\n').map(renderLine).join('\n');
    mirror.style.height=ta.style.height||Math.max(28,ta.scrollHeight)+'px'; mirror.scrollTop=ta.scrollTop; mirror.scrollLeft=ta.scrollLeft;
  }
  function refreshHighlights(){ editor.querySelectorAll('textarea').forEach(updateHighlight); }

  function cardId(){ return 'card-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
  function currentCard(){ return cards.find(card=>card.id===activeCardId); }
  function captureActiveCard(){ const card=currentCard(); if(card && appReady) card.content=serialize(); }
  function renderTabs(){
    const list=document.getElementById('tabs-list'); list.innerHTML='';
    cards.forEach(card=>{
      const tab=document.createElement('button'); tab.type='button'; tab.className='doc-tab'+(card.id===activeCardId?' active':''); tab.dataset.id=card.id;
      tab.innerHTML='<span class="tab-name">'+esc(card.title)+'</span><span class="tab-close" role="button" aria-label="Zavřít kartu">×</span>';
      tab.querySelector('.tab-name').ondblclick=e=>{ e.stopPropagation(); renameCard(card); };
      tab.querySelector('.tab-close').onclick=e=>{ e.stopPropagation(); removeCard(card.id); };
      tab.onclick=()=>switchCard(card.id);
      list.appendChild(tab);
    });
    requestAnimationFrame(()=>list.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'nearest'}));
  }
  function switchCard(id){
    if(id===activeCardId)return;
    captureActiveCard(); activeCardId=id; renderTabs(); render(currentCard()?.content||''); changed();
  }
  function addCard(title){
    captureActiveCard();
    const card={id:cardId(),title:title||'Nová karta',content:''}; cards.push(card); activeCardId=card.id; renderTabs(); render(''); changed();
    requestAnimationFrame(()=>renameCard(card));
  }
  function renameCard(card){
    askDialog('Název karty:',{defaultValue:card.title}).then(name=>{
      if(name!==null && name.trim()){card.title=name.trim();renderTabs();changed();}
    });
  }
  function removeCard(id){
    if(cards.length===1){flash('Dokument musí mít alespoň jednu kartu');return;}
    const card=cards.find(c=>c.id===id);
    askDialog('Odstranit kartu „'+card.title+'“?').then(ok=>{
      if(!ok)return;
      const index=cards.findIndex(c=>c.id===id); cards.splice(index,1);
      if(activeCardId===id){activeCardId=cards[Math.max(0,index-1)].id;render(currentCard().content||'');}
      renderTabs();changed();
    });
  }
  document.getElementById('add-tab').onclick=()=>addCard();

  function parseDocument(text){
    const lines=String(text||'').replace(/\r/g,'').split('\n');
    const out=[]; let normal=[];
    const flush=()=>{ if(normal.length){ out.push({type:'text',content:normal.join('\n')}); normal=[]; } };
    for(let i=0;i<lines.length;i++){
      const m=lines[i].trim().match(/^====\s*(VOLBA|HOD KOSTKOU|PLOCHA|JESTLI)\s*====$/i);
      if(!m){ normal.push(lines[i]); continue; }
      flush();
      const label=m[1].toUpperCase();
      const type=label==='VOLBA'?'choice':label==='PLOCHA'?'surface':label==='JESTLI'?'condition':'dice';
      const end=type==='choice'?/^====\s*KONEC VOLBY\s*====$/i:type==='surface'?/^====\s*KONEC PLOCHY\s*====$/i:type==='condition'?/^====\s*KONEC JESTLI\s*====$/i:/^====\s*KONEC (?:HODU|HODU KOSTKOU|KOSTKY)\s*====$/i;
      const body=[]; i++;
      while(i<lines.length&&!end.test(lines[i].trim())){ body.push(lines[i]); i++; }
      out.push({type,content:body.join('\n'),id:blockId(type,body.join('\n'),out.length)});
    }
    flush();
    return out.length?out:[{type:'text',content:''}];
  }
  function blockId(type,content,index){ let h=2166136261; const str=type+'|'+content.slice(0,120)+'|'+index; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)} return type+'-'+(h>>>0).toString(36); }
  function serialize(){
    return [...editor.querySelectorAll('[data-segment]')].map(el=>{
      const type=el.dataset.type, value=el.querySelector('textarea').value;
      if(type==='text') return value;
      const marks={choice:['====VOLBA====','====KONEC VOLBY===='],dice:['====HOD KOSTKOU====','====KONEC HODU===='],surface:['====PLOCHA====','====KONEC PLOCHY===='],condition:['====JESTLI====','====KONEC JESTLI====']};
      return marks[type][0]+'\n'+value+'\n'+marks[type][1];
    }).join('\n');
  }
  function countFor(type,value){
    if(type==='choice') return (value.split('\n').filter(x=>/^[A-Z]\s+\S/.test(x.trim())&&!/^=/.test(x.trim()))).length;
    if(type==='dice') return value.split('\n').filter(x=>/^\d+\s*-\s*\d+$/.test(x.trim())).length;
    if(type==='condition') return /^JINAK\s*$/im.test(value)?2:1;
    return value.split('\n').filter(x=>/^[-*]\s*(?:click|klik)\s+/i.test(x.trim())).length;
  }
  function countLabel(type,n){ return type==='choice'?`${n} možnost${n===1?'':n>=2&&n<=4?'i':'í'}`:type==='dice'?`${n} výsledk${n===1?'ek':n>=2&&n<=4?'y':'ů'}`:type==='condition'?(n===2?'if / else':'jen if, bez else'):`${n} aktivní ${n===1?'bod':n>=2&&n<=4?'body':'bodů'}`; }
  function render(text){
    editor.innerHTML=''; parseDocument(text).forEach((seg,i)=>editor.appendChild(createSegment(seg,i)));
    updateFooter();
  }
  function createSegment(seg,index){
    const wrap=document.createElement(seg.type==='text'?'div':'section');
    wrap.dataset.segment=''; wrap.dataset.type=seg.type;
    if(seg.type==='text'){
      wrap.innerHTML=`<div class="editable-wrap"><pre class="text-highlight" aria-hidden="true"></pre><textarea class="text-segment" spellcheck="false" aria-label="Text scénáře">${esc(seg.content)}</textarea></div>`;
    }else{
      const titles={choice:'VOLBA',dice:'HOD KOSTKOU',surface:'PLOCHA',condition:'JESTLI / JINAK'};
      const actions={choice:'+ možnost',dice:'+ výsledek',surface:'+ interakce',condition:'+ jinak'};
      const id=seg.id||blockId(seg.type,seg.content,index); wrap.dataset.id=id;
      wrap.className=`special-block ${seg.type}${collapsed[id]?' collapsed':''}`;
      wrap.innerHTML=`<header class="block-head"><button type="button" class="collapse" aria-label="Sbalit nebo rozbalit">${collapsed[id]?'▶':'▼'}</button><span class="block-title">${titles[seg.type]}</span><span class="block-count"></span><div class="block-tools">${seg.type!=='condition'?`<button type="button" class="add-row">${actions[seg.type]}</button>`:''}<button type="button" class="remove-block">odstranit</button></div></header><div class="block-content"><div class="editable-wrap"><pre class="text-highlight" aria-hidden="true"></pre><textarea class="special-body" spellcheck="false" aria-label="Obsah bloku ${titles[seg.type]}">${esc(seg.content)}</textarea></div>${seg.type==='surface'?'<div class="surface-preview"><div class="surface-preview-title">Interaktivní náhled plochy</div><div class="surface-items"></div></div>':''}</div>`;
    }
    const ta=wrap.querySelector('textarea');
    requestAnimationFrame(()=>{autoHeight(ta);updateHighlight(ta)});
    let composing=false;
    ta.addEventListener('compositionstart',()=>{
      composing=true;
      ta.parentElement?.classList.add('mobile-composing');
    });
    ta.addEventListener('input',()=>{
      if(!composing)expandShortcut(ta);
      // Resize immediately, not on the next animation frame — a one-frame
      // delay is exactly what let a just-typed line render outside the
      // (not-yet-grown) box on iOS until something bigger forced a reflow.
      if(!composing)autoHeight(ta);
      updateHighlight(ta);updateBlock(wrap);changed();
    });
    ta.addEventListener('compositionend',()=>{
      composing=false;
      autoHeight(ta);
      updateHighlight(ta);
      ta.parentElement?.classList.remove('mobile-composing');
      updateBlock(wrap);changed();
    });
    ta.addEventListener('scroll',()=>{
      const mirror=wrap.querySelector('.text-highlight');
      if(mirror){ mirror.scrollTop=ta.scrollTop; mirror.scrollLeft=ta.scrollLeft; }
    });
    ta.addEventListener('keydown',e=>handleTab(e,ta));
    ta.addEventListener('blur',()=>{
      ta.parentElement?.classList.remove('mobile-composing');
      autoHeight(ta);
      updateHighlight(ta);
    });
    if(seg.type!=='text'){
      wrap.querySelector('.collapse').onclick=()=>{ const open=wrap.classList.toggle('collapsed'); collapsed[wrap.dataset.id]=open; wrap.querySelector('.collapse').textContent=open?'▶':'▼'; changed(); };
      if(seg.type!=='condition') wrap.querySelector('.add-row').onclick=()=>addRow(wrap,ta);
      wrap.querySelector('.remove-block').onclick=()=>{ askDialog('Odstranit celý blok?').then(ok=>{ if(ok){wrap.remove();ensureTextSegment();changed();} }); };
      updateBlock(wrap);
    }
    return wrap;
  }
  function updateBlock(wrap){
    if(wrap.dataset.type==='text') return;
    const ta=wrap.querySelector('textarea'), n=countFor(wrap.dataset.type,ta.value);
    wrap.querySelector('.block-count').textContent='· '+countLabel(wrap.dataset.type,n);
    if(wrap.dataset.type==='surface') renderSurface(wrap,ta.value);
  }
  function parseSurfaceItems(value){
    const rx=/^[-*]\s*(?:click|klik)\s+(.+?)\s*(?:=>|->|—>|→)\s*(?:sc[eé]na\s+)?(.+?)\s*$/i;
    return value.split('\n').map(line=>line.trim().match(rx)).filter(Boolean).map(match=>({label:match[1].trim(),target:match[2].trim()}));
  }
  function renderSurface(wrap,value){
    const host=wrap.querySelector('.surface-items');
    if(!host) return;
    host.innerHTML='';
    const items=parseSurfaceItems(value);
    items.forEach(item=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='surface-hotspot object';
      button.innerHTML='<span class="hotspot-label">'+esc(item.label)+'</span><span class="hotspot-arrow">→</span><span class="hotspot-target">Scéna '+esc(item.target)+'</span>';
      button.title='Přejít na scénu '+item.target;
      button.onclick=()=>jumpToScene(item.target);
      host.appendChild(button);
    });
    if(!items.length) host.innerHTML='<span class="char-empty">Formát: - click Název -&gt; Scéna 1A</span>';
  }
  function insertSurfaceScene(surfaceBlock,target){
    const clean=String(target).replace(/^sc[eé]na\s+/i,'').trim();
    const escaped=clean.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(new RegExp('^#\\s*(?:Sc[eé]na\\s+)?'+escaped+'\\s*$','im').test(serialize())) return;
    let textSegment=surfaceBlock.nextElementSibling;
    if(!textSegment || textSegment.dataset.type!=='text'){
      textSegment=createSegment({type:'text',content:''},editor.children.length);
      surfaceBlock.after(textSegment);
    }
    const field=textSegment.querySelector('textarea');
    field.value=(field.value.trimEnd()+'\n\n# Scéna '+clean+'\n// Popis reakce po kliknutí.\n').replace(/^\n+/, '');
    autoHeight(field); updateHighlight(field);
  }

  function addRow(wrap,ta){
    const type=wrap.dataset.type;
    const editorScroll=editor.scrollTop;
    const blockTopBefore=wrap.getBoundingClientRect().top;
    let caret=ta.value.length;

    if(type==='choice'){
      const lines=ta.value.replace(/\s+$/,'').split('\n');
      let branchIndex=lines.findIndex(line=>/^=\s*[A-Z]\s*$/.test(line.trim()));
      if(branchIndex<0) branchIndex=lines.length;

      const used=lines.slice(0,branchIndex)
        .map(line=>line.trim().match(/^([A-Z])\s+\S/))
        .filter(Boolean)
        .map(match=>match[1].charCodeAt(0));
      const letter=String.fromCharCode(Math.min(90,Math.max(64,...used)+1));

      while(branchIndex>0 && lines[branchIndex-1]===''){
        lines.splice(branchIndex-1,1);
        branchIndex--;
      }
      lines.splice(branchIndex,0,letter+' Nová možnost','');
      const branchText='= '+letter+'\n';
      const body=lines.join('\n').replace(/\n{4,}/g,'\n\n\n').replace(/\s+$/,'');
      ta.value=body+'\n\n'+branchText;
      caret=ta.value.length;
    } else if(type==='dice'){
      const ranges=[...ta.value.matchAll(/^(\d+)\s*-\s*(\d+)\s*$/gm)];
      const last=ranges.length?ranges[ranges.length-1]:null;
      const start=last?Number(last[2])+1:1;
      const width=last?Math.max(0,Number(last[2])-Number(last[1])):2;
      ta.value=ta.value.replace(/\s+$/,'')+'\n\n'+start+' - '+(start+width)+'\nNový výsledek';
      caret=ta.value.length;
    } else {
      const numbers=parseSurfaceItems(ta.value).map(item=>item.target.match(/^(\d+)A$/i)).filter(Boolean).map(match=>Number(match[1]));
      const target=(numbers.length?Math.max(...numbers)+1:1)+'A';
      ta.value=ta.value.replace(/\s+$/,'')+'\n- click Nový objekt -> Scéna '+target;
      insertSurfaceScene(wrap,target);
      caret=ta.value.length;
    }

    autoHeight(ta);
    updateHighlight(ta);
    updateBlock(wrap);
    changed();
    ta.focus({preventScroll:true});
    ta.setSelectionRange(caret,caret);

    requestAnimationFrame(()=>{
      const blockTopAfter=wrap.getBoundingClientRect().top;
      editor.scrollTop=editorScroll+(blockTopAfter-blockTopBefore);
    });
  }
  function insertBlock(type){
    const templates={
      choice:'A První možnost\nB Druhá možnost\n\n= A\n\n= B',
      dice:'1 - 3\nNeúspěch\n\n4 - 6\nÚspěch',
      surface:'- click Mavris -> Scéna 1A\n- click Ruda -> Scéna 2A\n- click Vavřinec -> Scéna 3A',
      condition:'"mluvil s Vavřincem"\n\nDialog pokud ano.\n\nJINAK\n\nDialog pokud ne.'
    };
    const active=document.activeElement?.closest?.('[data-segment]');
    const node=createSegment({type,content:templates[type],id:blockId(type,Date.now().toString(),editor.children.length)},editor.children.length);
    active?active.after(node):editor.appendChild(node);
    if(type==='surface'){
      const scenes=createSegment({type:'text',content:'\n# Scéna 1A\n// Popis reakce po kliknutí na Mavrise.\n\n# Scéna 2A\n// Popis reakce po kliknutí na Rudu.\n\n# Scéna 3A\n// Popis reakce po kliknutí na Vavřince.\n'},editor.children.length);
      node.after(scenes);
    }
    updateHighlight(node.querySelector('textarea')); changed(); node.querySelector('textarea').focus();
  }

  function insertPlain(prefix){ let ta=document.activeElement; if(!ta?.matches('textarea')){ const seg=createSegment({type:'text',content:''},0); editor.appendChild(seg); ta=seg.querySelector('textarea'); } const p=ta.selectionStart; ta.value=ta.value.slice(0,p)+(p&&ta.value[p-1]!='\n'?'\n':'')+prefix+ta.value.slice(p); autoHeight(ta);changed();ta.focus(); }
  function jumpToScene(title){
    const clean=String(title).replace(/^sc[eé]na\s+/i,'').trim();
    const escaped=clean.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const patterns=[
      new RegExp('^#\\s*Sc[eé]na\\s+'+escaped+'\\s*$','im'),
      new RegExp('^#\\s*'+escaped+'\\s*$','im'),
      new RegExp('^'+escaped+'\\s*$','im')
    ];
    
    for(const field of editor.querySelectorAll('textarea')){
      let match=null;
      for(const pattern of patterns){match=field.value.match(pattern);if(match)break;}
      if(match){
        field.focus();
        field.setSelectionRange(match.index,match.index+match[0].length);
        field.scrollIntoView({behavior:isMobile()?'auto':'smooth',block:'center'});
        return;
      }
    }

    captureActiveCard();
    const targetCard=cards.find(c=>{
      return patterns.some(pattern=>pattern.test(c.content||''));
    });
    if(targetCard){
      switchCard(targetCard.id);
      requestAnimationFrame(()=>{ jumpToScene(clean); });
      return;
    }

    flash('scéna "'+clean+'" nenalezena');
  }

  function sceneNames(){
    captureActiveCard();
    const text=currentCard()?.content||'';
    const seen=new Set();
    return [...text.matchAll(/^#\s*(?:Sc[eé]na\s+)?(.+)$/gmi)]
      .map(match=>match[1].trim())
      .filter(name=>name && !/^KARTA:/i.test(name) && !seen.has(name.toLocaleLowerCase('cs-CZ')) && seen.add(name.toLocaleLowerCase('cs-CZ')));
  }
  function renderSceneNavigator(){
    const host=document.getElementById('scene-list');
    if(!host)return;
    const scenes=sceneNames();
    host.innerHTML='';
    if(!scenes.length){host.innerHTML='<div class="char-empty">V této kartě nejsou scény.</div>';return;}
    scenes.forEach(scene=>{
      const button=document.createElement('button');
      button.type='button';button.className='scene-link';button.title='Přejít na scénu '+scene;
      button.innerHTML='<span>'+esc(scene)+'</span>';
      button.onclick=()=>jumpToScene(scene);
      host.appendChild(button);
    });
  }
  function expandShortcut(ta){
    const end=ta.selectionStart;
    const start=ta.value.lastIndexOf('\n',end-1)+1;
    const typed=ta.value.slice(start,end);
    const match=typed.match(/^\s*([\p{L}\p{N}_-]+):$/u);
    if(!match)return;
    const key=match[1].toLocaleLowerCase('cs-CZ');
    const character=characters.find(c=>String(c.shortcut).toLocaleLowerCase('cs-CZ')===key);
    if(!character)return;
    const leading=typed.match(/^\s*/)[0];
    const replacement=leading+character.name.toLocaleUpperCase('cs-CZ')+': ';
    ta.value=ta.value.slice(0,start)+replacement+ta.value.slice(end);
    const pos=start+replacement.length;
    ta.setSelectionRange(pos,pos);
  }
  function handleTab(e,ta){ if(e.key!=='Tab')return;e.preventDefault();const p=ta.selectionStart;ta.value=ta.value.slice(0,p)+'  '+ta.value.slice(ta.selectionEnd);ta.setSelectionRange(p+2,p+2);autoHeight(ta);changed(); }
  function ensureTextSegment(){ if(!editor.children.length) editor.appendChild(createSegment({type:'text',content:''},0)); }
  function changed(){ updateFooter();renderSceneNavigator();setStatus('ukládání…','saving');clearTimeout(saveTimer);saveTimer=setTimeout(save,500); }
  function updateFooter(){ const v=serialize(); footer.textContent=(v? v.split('\n').length:0)+' řádků · '+v.length+' znaků · '+editor.querySelectorAll('.special-block').length+' bloků'; }
  async function save(){
    try{
      captureActiveCard();
      const snapshot={cards,activeCardId,characters,collapsed,updatedAt:new Date().toISOString()};
      await storage.set(STORAGE_KEY,JSON.stringify(snapshot));
      setStatus('uloženo '+new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}));
      queueCloudSave();
    }catch(e){setStatus('chyba ukládání','error');}
  }
  function renderCharacters(){
    charList.innerHTML='';
    if(!characters.length){
      charList.innerHTML='<div class="char-empty">Zatím žádné postavy.</div>';
      return;
    }
    characters.forEach((character,index)=>{
      const row=document.createElement('div');
      row.className='char-row';
      const color=character.color||'#c8a46b';
      row.innerHTML=`<span class="char-dot" style="background:${esc(color)}"></span><span class="shortcut">${esc(character.shortcut)}:</span><span class="name" style="color:${esc(color)}">${esc(character.name.toLocaleUpperCase('cs-CZ'))}</span><input class="color-edit" type="color" value="${esc(color)}" title="Změnit barvu postavy" aria-label="Barva postavy ${esc(character.name)}"><button type="button" class="remove" aria-label="Odebrat postavu">×</button>`;

      const picker=row.querySelector('.color-edit');
      const dot=row.querySelector('.char-dot');
      const name=row.querySelector('.name');

      const applyColor=()=>{
        character.color=picker.value;
        dot.style.background=picker.value;
        name.style.color=picker.value;
        refreshHighlights();
        changed();
      };
      picker.addEventListener('input',applyColor);
      picker.addEventListener('change',applyColor);
      row.querySelector('.remove').addEventListener('click',()=>{
        characters.splice(index,1);
        renderCharacters();
        refreshHighlights();
        changed();
      });
      charList.appendChild(row);
    });
  }

  function fullDocument(){captureActiveCard();return cards.map(card=>'# KARTA: '+card.title+'\n'+(card.content||'')).join('\n\n')}
  function aiHeader(){return ['### AI INSTRUKCE — FORMÁT SCÉNÁŘE ###','# Scénář vizuální novely. Speciální bloky VOLBA, HOD KOSTKOU, PLOCHA a JESTLI zachovej včetně jejich koncových značek.','# Blok JESTLI začíná řádkem s popisem podmínky v uvozovkách, např. "mluvil s Vavřincem", pak obsahuje dvě větve oddělené řádkem "JINAK" — první platí, pokud podmínka platí, druhá pokud ne.','# Postavy: '+(characters.map(c=>c.name.toUpperCase()).join(', ')||'(žádné)')+'.','### KONEC INSTRUKCÍ ###','',''].join('\n')}

  function stripAiHeader(text){
    return String(text||'').replace(/^\s*### AI INSTRUKCE[\s\S]*?### KONEC INSTRUKCÍ ###\s*\n*/,'');
  }
  function splitIntoCards(text){
    const marker=/^#\s*KARTA:\s*(.+)$/gm;
    const matches=[...text.matchAll(marker)];
    if(!matches.length) return [{title:'Import',content:text.trim()}];
    const parts=[];
    if(matches[0].index>0){
      const pre=text.slice(0,matches[0].index).trim();
      if(pre) parts.push({title:'Import',content:pre});
    }
    matches.forEach((m,i)=>{
      const start=m.index+m[0].length;
      const end=i+1<matches.length?matches[i+1].index:text.length;
      parts.push({title:m[1].trim()||'Import',content:text.slice(start,end).trim()});
    });
    return parts;
  }
  function suggestImportShortcut(name){
    const base=(name.trim()[0]||'p').toLocaleLowerCase('cs-CZ').replace(/[^\p{L}\p{N}_-]/gu,'')||'p';
    let sc=base,suffix=2;
    while(characters.some(c=>String(c.shortcut).toLocaleLowerCase('cs-CZ')===sc)) sc=base+(suffix++);
    return sc;
  }
  function normalizeCharacterName(rawName,mapping){
    if(mapping.has(rawName)) return mapping.get(rawName);
    const existing=characters.find(c=>c.name.trim().toLocaleUpperCase('cs-CZ')===rawName.toLocaleUpperCase('cs-CZ'));
    const canonical=existing?existing.name:rawName;
    if(!existing) characters.push({name:rawName,shortcut:suggestImportShortcut(rawName),color:'#c8a46b'});
    mapping.set(rawName,canonical);
    return canonical;
  }
  function rewriteCharacterNames(text,mapping){
    return text.split('\n').map(line=>{
      const trimmed=line.trim();
      if(/^\s*(\/\/|#|=|[-*]|"|https?:\/\/)/.test(trimmed)) return line;
      const m=line.match(/^([^:\n]{1,50}):(.*)$/);
      if(!m) return line;
      const name=m[1].trim();
      if(!name) return line;
      return normalizeCharacterName(name,mapping)+':'+m[2];
    }).join('\n');
  }
  function importText(rawText){
    const stripped=stripAiHeader(rawText);
    if(!stripped.trim()){ flash('soubor je prázdný'); return; }
    const mapping=new Map();
    const importedCards=splitIntoCards(stripped).map(c=>({title:c.title,content:rewriteCharacterNames(c.content,mapping)}));
    captureActiveCard();
    if(cards.length===1 && !(cards[0].content||'').trim()){
      cards=[];
    }
    const firstId=cardId();
    importedCards.forEach((c,i)=>{
      cards.push({id:i===0?firstId:cardId(),title:c.title,content:c.content});
    });
    activeCardId=firstId;
    renderCharacters();
    renderTabs();
    render(currentCard().content||'');
    changed();
    flash('importováno: '+importedCards.length+(importedCards.length===1?' karta':' karty/karet'));
  }
  document.getElementById('import-btn').onclick=()=>document.getElementById('import-file').click();
  document.getElementById('import-file').addEventListener('change',e=>{

    const reader=new FileReader();
    reader.onload=()=>{ importText(String(reader.result||'')); e.target.value=''; };
    reader.onerror=()=>flash('import selhal');
    reader.readAsText(file,'utf-8');
  });

  const sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('sidebar-backdrop'),toggle=document.getElementById('sidebar-toggle');function side(open){sidebar.classList.toggle('open',open);backdrop.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open))}toggle.onclick=()=>side(!sidebar.classList.contains('open'));backdrop.onclick=()=>side(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')side(false)});
  const mobileSheet=document.getElementById('mobile-sheet');
  const mobileSheetBackdrop=document.getElementById('mobile-sheet-backdrop');
  const mobileSheetTitle=document.getElementById('mobile-sheet-title');
  const mobileSheetContent=document.getElementById('mobile-sheet-content');
  const isMobile=()=>window.matchMedia('(max-width:720px)').matches;
  // The viewport meta tag now carries interactive-widget=resizes-content,
  // which on modern iOS/Android makes the layout viewport itself shrink
  // when the keyboard opens — so 100dvh in CSS already does the right
  // thing on its own, and Safari's native "scroll focused input into
  // view" behaves correctly inside that smaller viewport. We deliberately
  // do NOT layer extra JS scrolling or class-toggling on top of that
  // anymore: doing so previously fought the browser's own scroll/resize
  // handling and produced a feedback loop (page jumping, blank gray area
  // flashing behind the keyboard). The only thing left to JS is exposing
  // the keyboard's height as a CSS variable, purely for padding — and
  // it's heavily debounced so it can't itself trigger layout thrash.
  let viewportRaf=0;
  function updateMobileViewport(){
    if(!isMobile())return;
    cancelAnimationFrame(viewportRaf);
    viewportRaf=requestAnimationFrame(()=>{
      const vv=window.visualViewport;
      if(!vv)return;
      const keyboardHeight=Math.max(0,Math.round(window.innerHeight-vv.height));
      document.documentElement.style.setProperty('--keyboard-height',keyboardHeight+'px');
    });
  }
  window.visualViewport?.addEventListener('resize',updateMobileViewport);
  window.addEventListener('orientationchange',updateMobileViewport);
  updateMobileViewport();

  const mobileNav=document.querySelector('.mobile-nav');
  if(mobileNav){
    mobileNav.addEventListener('click',event=>{

  mobileSheetContent.addEventListener('click',event=>{
    const insert=event.target.closest('[data-insert]')?.dataset.insert;

  const cloudModal=document.getElementById('cloud-modal');
  const cloudBackdrop=document.getElementById('cloud-modal-backdrop');
  const cloudState=document.getElementById('cloud-state');
  const cloudButton=document.getElementById('cloud-btn');
  const cloudUrl=document.getElementById('supabase-url');
  const cloudKey=document.getElementById('supabase-key');
  const cloudEmail=document.getElementById('cloud-email');
  const cloudPassword=document.getElementById('cloud-password');

  function setCloudState(text,type=''){
    cloudState.textContent=text;
    cloudState.className='cloud-state'+(type?' '+type:'');
    cloudButton.textContent=text;
    cloudButton.classList.toggle('connected',Boolean(cloudUser));
    cloudButton.classList.toggle('sync-ok',type==='ok');
    cloudButton.classList.toggle('sync-error',type==='error');
    cloudButton.title=text+(cloudUser?' · Alt+klik pro účet':' · klikni pro přihlášení');
    const syncActions = document.querySelector('.cloud-sync-actions');
    if(syncActions) syncActions.style.display = cloudUser ? 'flex' : 'none';
  }
  function saveCloudConfig(){ initSupabase(); return true; }
  async function initSupabase(){
    const url=cloudUrl.value.trim()||SUPABASE_URL;
    const key=cloudKey.value.trim()||SUPABASE_ANON_KEY;
    cloudUrl.value=url;
    if(!window.supabase){supabaseClient=null;setCloudState('knihovna Supabase se nenačetla','error');return false;}
    try{
      supabaseClient=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      if(key===SUPABASE_ANON_KEY) cloudKey.value='';
      const {data,error}=await supabaseClient.auth.getSession();
      if(error)throw error;
      cloudUser=data.session?.user||null;
      setCloudState(cloudUser?'přihlášen: '+cloudUser.email+' · automatická synchronizace':'připojeno · přihlas se jen jednou',cloudUser?'ok':'');
      supabaseClient.auth.onAuthStateChange((event,session)=>{
        cloudUser=session?.user||null; cloudBootstrapped=false; if(!cloudUser)stopRealtime();
        setCloudState(cloudUser?'přihlášen: '+cloudUser.email+' · automatická synchronizace':'připojeno · přihlas se jen jednou',cloudUser?'ok':'');
        if(cloudUser&&appReady&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))setTimeout(syncCloudOnStart,0);
      });
      if(cloudUser&&appReady)await syncCloudOnStart();
      return true;
    }catch(error){supabaseClient=null;setCloudState('chyba připojení: '+error.message,'error');return false;}
  }
  function cloudDocumentKey(){ return CLOUD_DOCUMENT_KEY; }
  function cloudPayload(){captureActiveCard();return {cards,activeCardId,characters,collapsed,version:3,realtimeClientId:REALTIME_CLIENT_ID,savedAt:new Date().toISOString()};}
  async function uploadCloud(showMessage=true){
    if(!supabaseClient||!cloudUser){if(showMessage)setCloudState('nejdřív se přihlas','error');return false;}
    const row={user_id:cloudUser.id,document_key:cloudDocumentKey(),title:'scenar.io',payload:cloudPayload(),updated_at:new Date().toISOString()};
    const {data,error}=await supabaseClient.from('documents').upsert(row,{onConflict:'user_id,document_key'}).select('updated_at').single();
    if(error){setCloudState('cloud save selhal: '+error.message,'error');return false;}
    lastCloudUpdatedAt=Math.max(lastCloudUpdatedAt,Date.parse(data?.updated_at||row.updated_at)||0);
    if(showMessage)setCloudState('cloud uložen: '+new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}),'ok');
    return true;
  }
  function queueCloudSave(){
    if(applyingCloud||!supabaseClient||!cloudUser)return;
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer=setTimeout(()=>uploadCloud(false),1000);
  }
  async function applyCloudPayload(data){
    const payload=data?.payload||{};
    const remoteTime=Date.parse(data?.updated_at||payload.savedAt||0)||0;
    if(remoteTime&&remoteTime<lastCloudUpdatedAt)return false;
    lastCloudUpdatedAt=Math.max(lastCloudUpdatedAt,remoteTime);
    applyingCloud=true;
    cards=Array.isArray(payload.cards)&&payload.cards.length?payload.cards:cards;
    activeCardId=payload.activeCardId&&cards.some(card=>card.id===payload.activeCardId)?payload.activeCardId:cards[0]?.id;
    characters=Array.isArray(payload.characters)?payload.characters:characters;
    collapsed=payload.collapsed||{};
    renderCharacters();renderTabs();render(currentCard()?.content||'');captureActiveCard();renderSceneNavigator();
    await storage.set(STORAGE_KEY,JSON.stringify({cards,activeCardId,characters,collapsed,updatedAt:data.updated_at||new Date().toISOString()}));
    applyingCloud=false;
    return true;
  }
  function stopRealtime(){
    if(realtimeChannel&&supabaseClient)supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }
  function startRealtime(){
    stopRealtime();
    if(!supabaseClient||!cloudUser)return;
    realtimeChannel=supabaseClient
      .channel('scenar-main-'+cloudUser.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'documents',filter:'user_id=eq.'+cloudUser.id},async change=>{
        const row=change.new;
        if(!row||row.document_key!==cloudDocumentKey())return;
        if(row.payload?.realtimeClientId===REALTIME_CLIENT_ID)return;
        const applied=await applyCloudPayload(row);
        if(applied)setCloudState('realtime '+new Date(row.updated_at).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),'ok');
      })
      .subscribe(status=>{
        if(status==='SUBSCRIBED')setCloudState('synchronizováno','ok');
        if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setCloudState('realtime chyba','error');
      });
  }
  async function syncCloudOnStart(){
    if(cloudBootstrapped||!supabaseClient||!cloudUser||!appReady)return;
    cloudBootstrapped=true; setCloudState('synchronizuji…');
    const {data,error}=await supabaseClient.from('documents').select('payload,updated_at').eq('user_id',cloudUser.id).eq('document_key',cloudDocumentKey()).maybeSingle();
    if(error){cloudBootstrapped=false;setCloudState('automatická synchronizace selhala: '+error.message,'error');return;}
    if(data){await applyCloudPayload(data);setCloudState('synchronizováno','ok');}
    else await uploadCloud(false);
    startRealtime();
  }
  async function downloadCloud(){
    if(!supabaseClient||!cloudUser){setCloudState('nejdřív se přihlas','error');return;}
    const {data,error}=await supabaseClient.from('documents').select('payload,updated_at').eq('user_id',cloudUser.id).eq('document_key',cloudDocumentKey()).maybeSingle();
    if(error){setCloudState('načtení selhalo: '+error.message,'error');return;}
    if(!data){setCloudState('v cloudu zatím není uložený dokument','error');return;}
    await applyCloudPayload(data);
    setCloudState('cloud načten: '+new Date(data.updated_at).toLocaleString('cs-CZ'),'ok');
    closeCloudModal();
  }
  function openCloudModal(){cloudModal.classList.add('open');cloudBackdrop.classList.add('open');cloudModal.setAttribute('aria-hidden','false');}
  function closeCloudModal(){cloudModal.classList.remove('open');cloudBackdrop.classList.remove('open');cloudModal.setAttribute('aria-hidden','true');}

  cloudButton.onclick=event=>{if(!cloudUser||event.altKey)openCloudModal();};
  document.getElementById('cloud-close').onclick=closeCloudModal;
  cloudBackdrop.onclick=closeCloudModal;
  document.getElementById('cloud-test').onclick=async()=>{
    if(!supabaseClient&&!saveCloudConfig())return;
    const {error}=await supabaseClient.from('documents').select('document_key',{head:true,count:'exact'}).limit(1);
    setCloudState(error?'test selhal: '+error.message:'připojení funguje',error?'error':'ok');
  };
  document.getElementById('cloud-sign-in').onclick=async()=>{
    if(!supabaseClient&&!saveCloudConfig())return;
    const {error}=await supabaseClient.auth.signInWithPassword({email:cloudEmail.value.trim(),password:cloudPassword.value});
    if(error)setCloudState('přihlášení selhalo: '+error.message,'error');
  };
  document.getElementById('cloud-sign-up').onclick=async()=>{
    if(!supabaseClient&&!saveCloudConfig())return;
    const {data,error}=await supabaseClient.auth.signUp({email:cloudEmail.value.trim(),password:cloudPassword.value});
    if(error)setCloudState('registrace selhala: '+error.message,'error');
    else setCloudState(data.session?'účet vytvořen a přihlášen':'účet vytvořen, zkontroluj e-mail','ok');
  };
  document.getElementById('cloud-sign-out').onclick=async()=>{if(supabaseClient)await supabaseClient.auth.signOut();};
  document.getElementById('cloud-upload').onclick=()=>uploadCloud(true);
  document.getElementById('cloud-download').onclick=downloadCloud;
  document.getElementById('copy-sql').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('supabase-sql').value);setCloudState('SQL zkopírováno','ok');};
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeCloudModal();});

  async function init(){
    let legacyContent='';
    try{
      const r=await storage.get(STORAGE_KEY);
      if(r?.value){
        const d=JSON.parse(r.value);
        characters=Array.isArray(d.characters)?d.characters:[]; collapsed=d.collapsed||{}; characters.forEach(c=>{if(!c.color||['#697565','#7fada0','#5ec8a5'].includes(String(c.color).toLowerCase()))c.color='#c8a46b';});
        if(Array.isArray(d.cards)&&d.cards.length){ cards=d.cards; activeCardId=d.activeCardId&&cards.some(c=>c.id===d.activeCardId)?d.activeCardId:cards[0].id; }
        else legacyContent=d.content||'';
      } else {
        const old=await storage.get('vn-editor:state');
        if(old?.value){const d=JSON.parse(old.value);legacyContent=d.content||'';characters=d.characters||[];characters.forEach(c=>{if(!c.color||['#697565','#7fada0','#5ec8a5'].includes(String(c.color).toLowerCase()))c.color='#c8a46b';});}
      }
    }catch(e){}
    if(!cards.length){cards=[{id:cardId(),title:'Scénář',content:legacyContent}];activeCardId=cards[0].id;}
    renderCharacters();renderTabs();render(currentCard().content||'');renderSceneNavigator();setStatus(currentCard().content?'načteno':'nový soubor');
    appReady=true; await initSupabase();
  }
  window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);stopRealtime();save()});init();
})();
</script>
